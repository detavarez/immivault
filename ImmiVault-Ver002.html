<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImmiVault Ver002</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Fraunces:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sage:#3A6B5C;--sage-d:#2C5246;--sage-l:#E6EFEB;--gold:#B8892B;--gold-l:#FBF3DF;--rose:#B23A48;--rose-l:#FBE9EB;--ink:#1D2A26;--mute:#5B6A65;--line:#D8E0DC;--bg:#F6F8F7;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0 0 .5rem}
header{background:var(--sage);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header .brand{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:700}
.ver{font-family:'DM Mono',monospace;background:#fff;color:var(--sage-d);border-radius:6px;padding:2px 8px;font-size:.85rem;font-weight:500}
header .sp{flex:1}
main{max-width:860px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.btn{font:inherit;font-weight:500;border:1px solid var(--sage);background:var(--sage);color:#fff;border-radius:8px;padding:10px 16px;cursor:pointer;min-height:44px}
.btn:hover{background:var(--sage-d)}
.btn.sec{background:#fff;color:var(--sage-d)}
.btn.warn{background:var(--gold);border-color:var(--gold)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
header .btn{background:transparent;border-color:#fff;min-height:36px;padding:4px 10px}
label{display:block;font-weight:500;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:44px}
input:focus,select:focus,textarea:focus,.btn:focus{outline:3px solid #9CC3B5;outline-offset:1px}
textarea{min-height:90px}
.help{color:var(--mute);font-size:.88rem;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.yn{display:flex;gap:8px}
.yn label{flex:1;margin:0;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;cursor:pointer;font-weight:500;background:#fff}
.yn input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.yn label{position:relative}
.yn label:has(input:focus-visible){outline:3px solid #9CC3B5;outline-offset:1px}
.yn input:checked+span{color:#fff}
.yn label:has(input:checked){background:var(--sage);color:#fff;border-color:var(--sage)}
.yn label.no:has(input:checked){background:var(--ink);border-color:var(--ink)}
.banner{border-radius:10px;padding:12px 14px;margin:12px 0;border:1px solid}
.banner.gold{background:var(--gold-l);border-color:var(--gold)}
.banner.rose{background:var(--rose-l);border-color:var(--rose)}
.banner.sage{background:var(--sage-l);border-color:var(--sage)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;justify-content:space-between;align-items:center;z-index:5}
.nav .mid{font-family:'DM Mono',monospace;font-size:.85rem;color:var(--mute);text-align:center;flex:1}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;background:var(--sage)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .grow{flex:1}
.item{border:1px dashed var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#FAFCFB}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;font-family:'DM Mono',monospace}
.pill.l{background:var(--sage-l);color:var(--sage-d)}.pill.w{background:var(--gold-l);color:#7A5A12}.pill.r{background:var(--rose-l);color:var(--rose)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.mono{font-family:'DM Mono',monospace}
.hide{display:none!important}
.case{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.partnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.partnav button{font:inherit;font-size:.82rem;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;cursor:pointer}
.partnav button.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.partnav button.done{border-color:var(--sage)}
@media print{header,.nav,.noprint{display:none!important}body{background:#fff}.card{border:0;padding:0}main{padding:0}}
</style>
</head>

function riskCalc(c){
 const a=c.answers;let score=0;const hits=[];
 RISK.forEach(([id,w,l])=>{if(a['q_'+id]==='yes'){score+=w;hits.push({id,w,l,x:a['x_'+id]})}});

}
const DAY=86400000;
function eligCalc(c){
 const a=c.answers;const r={items:[],ok:true};
 const years=a.basis==='spouse'?3:5;
 if(a.dob){const age=(Date.now()-new Date(a.dob))/DAY/365.25;r.items.push({ok:age>=18,t:UI.ageOk})}
 if(!a.lprDate){r.noLpr=true;return r}
 const start=new Date(a.lprDate);const earliest=new Date(start);earliest.setFullYear(earliest.getFullYear()+years);earliest.setDate(earliest.getDate()-90);
 r.earliest=earliest.toISOString().slice(0,10);r.earliestOk=earliest<=new Date();
 const periodStart=new Date();periodStart.setFullYear(periodStart.getFullYear()-years);
 const from=new Date(Math.max(periodStart,start));
 const totalDays=Math.round((Date.now()-from)/DAY);
 let out=0;r.long=[];r.broke=[];
 (a.anyTrips==='yes'?(a.trips||[]):[]).forEach(t=>{
  if(!t.out||!t.back)return;
  const o=new Date(t.out),b=new Date(t.back);const len=Math.round((b-o)/DAY);
  const s=Math.max(o,from),e=Math.min(b,Date.now());if(e>s)out+=Math.round((e-s)/DAY);
  if(len>=365)r.broke.push(t);else if(len>=180)r.long.push(t);
 });
 r.daysIn=totalDays-out;r.need=Math.ceil(totalDays/2);r.years=years;
 return r;
}

 PARTS.forEach(p=>visible(p.fields,a).forEach(x=>{
  if(x.sub)return;
  if(x.type==='list'){(a[x.k]||[]).forEach((it,i)=>x.item.forEach(s=>keys.push({key:`${x.k}.${i}.${s.k}`,label:`${T(x.l)} #${i+1} · ${T(s.l)}`,val:it[s.k],type:s.type,hint:[]})))}
  else keys.push({key:x.k,label:T(x.l),val:a[x.k],type:x.type,hint:x.pdf||[],opts:x.opts});
 }));
 return keys;
}
function displayVal(k){
 if(k.type==='yesno')return k.val==='yes'?'Yes':k.val==='no'?'No':'';
 if(k.type==='select'){const o=(typeof k.opts==='string'?OPT[k.opts]:[])||[];const m=o.find(([v])=>v===k.val);return m?m[1].en:(k.val||'')}
 return k.val==null?'':String(k.val);
}
function viewPdfMap(c){
 const keys=pdfKeys(c);const opts=['<option value="">'+T(UI.none)+'</option>'].concat(S.pdf.fields.map(fl=>`<option value="${esc(fl.name)}">${esc(fl.name)} (${fl.kind})</option>`)).join('');
 const sel=(key,cur)=>opts.replace(`value="${esc(cur||'')}"`,`value="${esc(cur||'')}" selected`);
 return `<p class="mono help">${esc(S.pdf.name)} · ${T(UI.pdfFields)}: ${S.pdf.fields.length}</p>
 <div class="row"><button class="btn sm sec" data-act="automatch">${T(UI.autoMatch)}</button><button class="btn sm sec" data-act="exportmap">${T(UI.exportMap)}</button><label class="btn sm sec" style="margin:0">${T(UI.importMap)}<input type="file" accept="application/json" data-act="importmap" class="hide"></label><button class="btn sm" data-act="fillpdf">${T(UI.download)}</button></div>
 <div style="overflow-x:auto"><table><tr><th>${T(UI.answer)}</th><th>${T(UI.pdfField)}</th></tr>
 ${keys.map(k=>{const m=S.pdf.map[k.key]||{};return `<tr><td>${esc(k.label)}<div class="help mono">${esc(displayVal(k)||'—')}</div></td><td><select data-pmap="${esc(k.key)}" data-slot="yes">${sel(k.key,m.yes)}</select>${k.type==='yesno'?`<div class="help">${T(UI.pdfFieldNo)}</div><select data-pmap="${esc(k.key)}" data-slot="no">${sel(k.key,m.no)}</select>`:''}</td></tr>`}).join('')}</table></div>`;
}
function loadPdfLib(){
 if(window.PDFLib)return Promise.resolve();
 return new Promise((res,rej)=>{const s=document.createElement('script');s.src=PDFLIB_URL;s.onload=res;s.onerror=()=>rej(new Error('pdf-lib'));document.head.appendChild(s)});
}
function pdfMsg(t,bad){const m=document.getElementById('pdfmsg');if(!m)return;m.textContent=t||'';m.style.color=bad?'var(--rose)':'var(--mute)'}
function mapStoreKey(){return 'immivault.pdfmap.'+S.pdf.name}
function loadMap(){try{S.pdf.map=JSON.parse(localStorage.getItem(mapStoreKey())||'{}')}catch(e){S.pdf.map={}}}
function saveMap(){try{localStorage.setItem(mapStoreKey(),JSON.stringify(S.pdf.map))}catch(e){}}
function norm(s){return String(s).replace(/\[\d+\]/g,'').replace(/[^A-Za-z]/g,'').toLowerCase()}
function autoMatch(){
 const c=cur();const keys=pdfKeys(c);let n=0;
 keys.forEach(k=>{
  if(!k.hint.length||S.pdf.map[k.key]?.yes)return;
  const hit=S.pdf.fields.find(fl=>fl.kind==='text'&&k.hint.some(h=>norm(fl.name).includes(norm(h))));
  if(hit){S.pdf.map[k.key]={yes:hit.name};n++}
 });
 saveMap();return n;
}
async function fillPdf(){
 const c=cur();
 try{await loadPdfLib()}catch(e){alert(T(UI.pdfLibFail));return}
 const {PDFDocument}=window.PDFLib;
 let doc,form;try{doc=await PDFDocument.load(S.pdf.bytes,{ignoreEncryption:true,updateMetadata:false});form=doc.getForm()}catch(err){pdfMsg(T(UI.pdfErr)+' ('+err.message+')',true);return}
 let n=0;
 const setText=(name,val)=>{try{form.getTextField(name).setText(String(val));n++}catch(e){try{form.getDropdown(name).select(String(val));n++}catch(e2){}}};
 const setCheck=(name,on)=>{try{const cb=form.getCheckBox(name);on?cb.check():cb.uncheck();n++}catch(e){}};
 pdfKeys(c).forEach(k=>{
  const m=S.pdf.map[k.key];if(!m)return;
  if(k.type==='yesno'){
   if(m.yes)setCheck(m.yes,k.val==='yes');
   if(m.no)setCheck(m.no,k.val==='no');
  }else if(m.yes){const v=displayVal(k);if(v!=='')setText(m.yes,v)}
 });
 let bytes;try{bytes=await doc.save()}catch(err){pdfMsg(T(UI.pdfErr)+' ('+err.message+')',true);return}
 const blob=new Blob([bytes],{type:'application/pdf'});
 dl(blob,`${c.name.replace(/\W+/g,'_')}_N-400_filled.pdf`);
 pdfMsg(`${n} ${T(UI.filledN)}`);
}
function dl(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500)}

document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const act=el.dataset.act;
 if(el.tagName==='INPUT'&&el.type==='file')return;
 if(el.tagName==='A')e.preventDefault();
 const c=S.caseId?cur():null;
 switch(act){
  case 'lang':S.lang=S.lang==='en'?'es':'en';S.db.lang=S.lang;persist();render(true);break;
  case 'home':S.mode='home';S.caseId=null;render();break;
  case 'lock':S.key=null;S.salt=null;S.db={cases:[],lang:S.lang};S.caseId=null;S.mode='unlock';render();break;
  case 'setpass':{
   const p=$('#pp').value;if(p.length<8){$('#err').textContent=T(UI.minPass);break}
   S.salt=crypto.getRandomValues(new Uint8Array(16));S.key=await deriveKey(p,S.salt);S.mode='home';await persist();render();break}
  case 'skippass':S.mode='home';await persist();render();break;
  case 'unlock':{
   try{
    const st=JSON.parse(localStorage.getItem(KEY_ENC));const salt=unb64(st.salt);const key=await deriveKey($('#pp').value,salt);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(st.iv)},key,unb64(st.data));
    S.db=JSON.parse(new TextDecoder().decode(pt));S.key=key;S.salt=salt;S.lang=S.db.lang||'en';S.mode='home';render();
   }catch(err){$('#err').textContent=T(UI.wrongPass)}
   break}
  case 'newcase':{
   const name=$('#cname').value.trim();if(!name){$('#cname').focus();break}
   const nc={id:uid(),name,answers:{},updated:new Date().toISOString(),disc:false};
   S.db.cases.unshift(nc);await persist();S.caseId=nc.id;S.partIdx=0;S.mode='disclaimer';render();break}
  case 'open':S.caseId=el.dataset.id;S.partIdx=0;S.mode=cur().disc?'wizard':'disclaimer';render();break;
  case 'delcase':if(confirm(T(UI.confirmDel))){S.db.cases=S.db.cases.filter(x=>x.id!==el.dataset.id);await persist();render()}break;
  case 'ackdisc':cur().disc=true;await persist();S.mode='wizard';render();break;
  case 'goto':S.partIdx=+el.dataset.i;render();break;
  case 'gotopart':S.partIdx=PARTS.findIndex(p=>p.id===+el.dataset.pid);S.mode='wizard';render();break;
  case 'prev':if(S.partIdx>0){S.partIdx--;render()}break;
  case 'next':if(S.partIdx<PARTS.length-1){S.partIdx++;render()}else{S.mode='review';render()}break;
  case 'backwiz':S.mode='wizard';render();break;
  case 'additem':{const arr=c.answers[el.dataset.k]=c.answers[el.dataset.k]||[];arr.push({});await persist();render(true);break}
  case 'rmitem':{c.answers[el.dataset.k].splice(+el.dataset.i,1);await persist();render(true);break}
  case 'exportall':dl(new Blob([JSON.stringify(S.db)],{type:'application/json'}),`ImmiVault-${VER}-backup.json`);break;
  case 'exportcase':dl(new Blob([JSON.stringify(c)],{type:'application/json'}),`${c.name.replace(/\W+/g,'_')}.json`);break;
  case 'print':window.print();break;
  case 'goack':S.ack[c.id]={go:el.checked};render(true);break;
  case 'automatch':{const n=autoMatch();$('#pdfzone').innerHTML=viewPdfMap(c);break}
  case 'exportmap':dl(new Blob([JSON.stringify(S.pdf.map)],{type:'application/json'}),'n400-mapping.json');break;
  case 'fillpdf':await fillPdf();break;
 }
});

document.addEventListener('change',async e=>{
 const el=e.target;
 if(el.dataset.act==='importall'){
  const txt=await el.files[0].text();try{const d=JSON.parse(txt);if(!Array.isArray(d.cases))throw 0;d.cases.forEach(cs=>{if(!S.db.cases.find(x=>x.id===cs.id))S.db.cases.push(cs)});await persist();render()}catch(err){alert('Invalid file')}
  return}
 if(el.dataset.act==='pdfload'){
  const file=el.files&&el.files[0];if(!file)return;
  pdfMsg(T(UI.pdfLoading));
  try{
   await loadPdfLib();
   const buf=await file.arrayBuffer();S.pdf.bytes=buf.slice(0);S.pdf.name=file.name;
   const doc=await window.PDFLib.PDFDocument.load(buf,{ignoreEncryption:true,updateMetadata:false});
   const P=window.PDFLib;
   S.pdf.fields=doc.getForm().getFields().map(fl=>({name:fl.getName(),kind:fl instanceof P.PDFTextField?'text':fl instanceof P.PDFCheckBox?'checkbox':fl instanceof P.PDFDropdown?'dropdown':'other'}));
   S.pdf.doc=true;
   if(!S.pdf.fields.length){pdfMsg(T(UI.pdfNoFields),true);return}
   loadMap();pdfMsg('');$('#pdfzone').innerHTML=viewPdfMap(cur());
  }catch(err){
   console.error(err);
   pdfMsg(String(err&&err.message||'').includes('pdf-lib')?T(UI.pdfLibFail):T(UI.pdfErr)+' ('+(err&&err.message||err)+')',true);
  }
  el.value='';return}
 if(el.dataset.act==='importmap'){
  try{S.pdf.map=JSON.parse(await el.files[0].text());saveMap();$('#pdfzone').innerHTML=viewPdfMap(cur())}catch(err){alert('Invalid file')}return}
 if(el.dataset.pmap){
  const k=el.dataset.pmap;S.pdf.map[k]=S.pdf.map[k]||{};if(el.value)S.pdf.map[k][el.dataset.slot]=el.value;else delete S.pdf.map[k][el.dataset.slot];saveMap();return}
 if(el.dataset.path&&(el.dataset.t==='yesno'||el.dataset.t==='select')){
  setPath(cur(),el.dataset.path,el.value);await persist();render(true);return}
 if(el.dataset.path&&S.mode==='review'){setPath(cur(),el.dataset.path,el.value);await persist();render(true)}
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.path&&el.dataset.t==='text'&&S.mode==='wizard'){setPath(cur(),el.dataset.path,el.value);saveSoon()}
});

boot();
</script>
